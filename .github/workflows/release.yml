name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Ntfy.Windows.csproj

      - name: Publish
        run: dotnet publish Ntfy.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Archive publish output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ntfy-windows-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-win-x64
          path: ntfy-windows-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ntfy-windows-win-x64.zip
          generate_release_notes: true

name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used by installers (leave empty for 0.0.<run number>)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: x86
            rid: win-x86
          - arch: x64
            platform: x64
            rid: win-x64
          - arch: arm64
            platform: ARM64
            rid: win-arm64

    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      RID: ${{ matrix.rid }}
      PUBLISH_DIR: publish/${{ matrix.rid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore Ntfy.Windows.csproj -r $env:RID -p:Platform=$env:PLATFORM

      - name: Publish portable build
        shell: pwsh
        run: >-
          dotnet publish Ntfy.Windows.csproj
          -c Release
          -r $env:RID
          -p:Platform=$env:PLATFORM
          --self-contained true
          -p:PublishSingleFile=false
          --no-restore
          -o $env:PUBLISH_DIR

      - name: Archive portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath "artifacts/ntfy-windows-win-$env:ARCH-portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            throw "Inno Setup compiler was not found"
          }
          $sourceDir = (Resolve-Path $env:PUBLISH_DIR).Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppArch=$env:ARCH" "/DSourceDir=$sourceDir" "/O$((Resolve-Path artifacts).Path)" installer/Ntfy.Windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-windows-win-${{ matrix.arch }}
          path: |
            artifacts/ntfy-windows-win-${{ matrix.arch }}-portable.zip
            artifacts/ntfy-windows-win-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f \
            \( -name 'ntfy-windows-win-*-portable.zip' -o -name 'ntfy-windows-win-*-setup.exe' \) \
            -printf '%f\n' \
            | LC_ALL=C sort \
            | while IFS= read -r file; do sha256sum "$file"; done \
            > SHA256SUMS.txt

          expected=6
          actual="$(wc -l < SHA256SUMS.txt)"
          if [[ "$actual" -ne "$expected" ]]; then
            echo "::error::Expected $expected release files, but checksummed $actual."
            cat SHA256SUMS.txt
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
